<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A kaki filmek elköltözött</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #120905;
      color: #fbefdc;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 700px;
      animation: appear 1s ease both;
    }

    h1 {
      color: #ffad55;
      font-size: clamp(32px, 7vw, 60px);
      margin-bottom: 28px;
    }

    p {
      color: #c9a77d;
      font-size: clamp(18px, 4vw, 24px);
    }

    a {
      color: #ffad55;
      overflow-wrap: anywhere;
    }

    a:hover {
      color: #ffe0a8;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1>A kaki filmek elköltözött</h1>
    <p>Új címünk:</p>
    <p>
      <a href="https://mitnezzekma.vercel.app/">
        megnézem
      </a>
    </p>
  </main>
</body>
</html>
